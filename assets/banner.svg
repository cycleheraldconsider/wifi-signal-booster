<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#061422"/>
      <stop offset="55%" stop-color="#0a2036"/>
      <stop offset="100%" stop-color="#0d2f44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- faint tech grid -->
  <g stroke="#1e4a63" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="140" y1="0" x2="140" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="980" y1="0" x2="980" y2="360"/>
  </g>

  <!-- glow behind router -->
  <ellipse cx="990" cy="185" rx="380" ry="300" fill="url(#glow)"/>

  <!-- concentric wifi signal arcs -->
  <g fill="none" stroke="#22d3ee" opacity="0.9">
    <path d="M 895 235 A 130 130 0 0 1 1085 235" stroke-width="6" opacity="0.85"/>
    <path d="M 855 260 A 175 175 0 0 1 1125 260" stroke-width="5" opacity="0.6"/>
    <path d="M 815 285 A 220 220 0 0 1 1165 285" stroke-width="4" opacity="0.35"/>
    <path d="M 775 310 A 265 265 0 0 1 1205 310" stroke-width="3" opacity="0.18"/>
  </g>

  <!-- router body -->
  <g>
    <rect x="945" y="215" width="90" height="34" rx="8" fill="#0f2f42" stroke="#5eead4" stroke-width="2"/>
    <circle cx="960" cy="232" r="4" fill="#5eead4"/>
    <circle cx="975" cy="232" r="4" fill="#22d3ee" opacity="0.7"/>
    <line x1="965" y1="215" x2="950" y2="185" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <line x1="1010" y1="215" x2="1025" y2="185" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <circle cx="950" cy="182" r="3.5" fill="#22d3ee"/>
    <circle cx="1025" cy="182" r="3.5" fill="#22d3ee"/>
  </g>

  <!-- signal strength bars, small decorative -->
  <g>
    <rect x="1075" y="255" width="10" height="20" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="1090" y="245" width="10" height="30" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="1105" y="230" width="10" height="45" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="1120" y="210" width="10" height="65" fill="url(#barGrad)" opacity="0.75"/>
  </g>

  <!-- scattered particles -->
  <g fill="#5eead4">
    <circle cx="640" cy="70" r="2.5" opacity="0.5"/>
    <circle cx="700" cy="300" r="2" opacity="0.4"/>
    <circle cx="820" cy="90" r="2" opacity="0.4"/>
    <circle cx="580" cy="260" r="2.5" opacity="0.35"/>
    <circle cx="900" cy="60" r="1.8" opacity="0.5"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#textGlow)" textLength="760" lengthAdjust="spacingAndGlyphs">WiFi Signal Booster</text>

  <!-- tagline -->
  <text x="60" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#b7e8f2">
    <tspan x="60" y="210" textLength="990" lengthAdjust="spacingAndGlyphs">Reads signal strength, processes optimal channels,</tspan>
    <tspan x="60" y="245" textLength="700" lengthAdjust="spacingAndGlyphs">exports boosted WiFi range — no setup</tspan>
  </text>

  <!-- underline accent -->
  <rect x="60" y="270" width="220" height="4" rx="2" fill="#22d3ee" opacity="0.8"/>
</svg>